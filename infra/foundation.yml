AWSTemplateFormatVersion: '2010-09-09'
Description: Text2BI private uploads, image repositories, and encrypted PostgreSQL in an existing VPC.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetA:
    Type: AWS::EC2::Subnet::Id
  SubnetB:
    Type: AWS::EC2::Subnet::Id
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
  DbAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
Resources:
  UploadBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Private durable source files and logos shared by short-lived tasks.
        must: [Keep public access blocked, Retain user data on stack deletion]
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
  UploadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt UploadBucket.Arn
              - !Sub '${UploadBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  BackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      ImageScanningConfiguration:
        ScanOnPush: true
  FrontendRepository:
    Type: AWS::ECR::Repository
    Properties:
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      ImageScanningConfiguration:
        ScanOnPush: true
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Keep PostgreSQL private; application stack grants only task ingress.
        must: [Never allow public PostgreSQL ingress]
    Properties:
      GroupDescription: Text2BI PostgreSQL access
      VpcId: !Ref VpcId
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Text2BI database subnets
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Managed durable workspace and serving tables; credentials managed by RDS.
        must: [Keep private, Keep encrypted, Preserve data on replacement]
    Properties:
      Engine: postgres
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      PubliclyAccessible: false
      MultiAZ: false
      DBName: text2bi
      MasterUsername: text2bi
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!GetAtt DbSecurityGroup.GroupId]
      BackupRetentionPeriod: 7
      DeletionProtection: true
Outputs:
  UploadBucket:
    Value: !Ref UploadBucket
  BackendRepositoryUri:
    Value: !GetAtt BackendRepository.RepositoryUri
  FrontendRepositoryUri:
    Value: !GetAtt FrontendRepository.RepositoryUri
  DbHost:
    Value: !GetAtt Database.Endpoint.Address
  DbSecretArn:
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  DbSecurityGroupId:
    Value: !GetAtt DbSecurityGroup.GroupId
