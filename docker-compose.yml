services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: text2bi
      POSTGRES_USER: text2bi
      POSTGRES_PASSWORD: text2bi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U text2bi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
